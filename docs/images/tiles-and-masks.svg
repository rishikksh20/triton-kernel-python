<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Tiling selects data; masks protect the edge</title><desc id="desc">A 1024-square matrix is divided into an eight-by-eight grid of 128-square logical tiles. The highlighted tile at coordinate row two, column three covers rows 256 through 383 and columns 384 through 511. A separate 1000-element vector example has four 256-position logical tiles, with 24 invalid positions in the final tile.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="#64748b"/></marker></defs>
