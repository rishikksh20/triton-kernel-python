<text x="32" y="621" font-size="19" fill="#172b4d" font-weight="700" text-anchor="start">Highlighted matrix tile (row 2, col 3): rows 256..383 and columns 384..511.</text>
<text x="32" y="655" font-size="17" fill="#475569" font-weight="400" text-anchor="start">An edge tile keeps its logical shape. Masks decide which positions participate in memory operations.</text>
