<text x="32" y="42" font-size="27" fill="#172b4d" font-weight="700" text-anchor="start">Tiling selects data; masks protect the edge</text>
<text x="32" y="73" font-size="17" fill="#475569" font-weight="400" text-anchor="start">Tile dimensions describe logical data. The compiler maps that data to threads later.</text>
