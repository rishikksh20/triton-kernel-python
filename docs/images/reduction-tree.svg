<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Reduction: many tile values become one result</title><desc id="desc">An illustrative addition tree reduces seven valid values and one zero-padding value within one program. Pair sums 3, 7, 11, and 7 become 10 and 18, then the final sum 28. A separate lower panel shows that independent program partial sums require a second reduction phase to produce a whole-input sum. Actual compiler communication can differ from the tree.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="#64748b"/></marker></defs>
<rect width="1200" height="820" rx="16" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="32" y="42" font-size="27" fill="#172b4d" font-weight="700" text-anchor="start">Reduction: many tile values become one result</text>
<text x="32" y="73" font-size="17" fill="#475569" font-weight="400" text-anchor="start">Illustrative logical addition tree, not a diagram of exact warp instructions or clock cycles.</text>
<text x="32" y="110" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">One program: 7 valid values + 1 neutral padding value</text>
<rect x="32.0" y="144" width="112" height="53" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="88" y="179" font-size="22" fill="#047857" font-weight="700" text-anchor="middle">1</text>
<path d="M88,203 L159,249" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<rect x="174.0" y="144" width="112" height="53" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="230" y="179" font-size="22" fill="#047857" font-weight="700" text-anchor="middle">2</text>
<path d="M230,203 L159,249" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<rect x="316.0" y="144" width="112" height="53" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="372" y="179" font-size="22" fill="#047857" font-weight="700" text-anchor="middle">3</text>
<path d="M372,203 L443,249" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<rect x="458.0" y="144" width="112" height="53" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="514" y="179" font-size="22" fill="#047857" font-weight="700" text-anchor="middle">4</text>
<path d="M514,203 L443,249" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<rect x="600.0" y="144" width="112" height="53" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="656" y="179" font-size="22" fill="#047857" font-weight="700" text-anchor="middle">5</text>
<path d="M656,203 L727,249" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<rect x="742.0" y="144" width="112" height="53" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="798" y="179" font-size="22" fill="#047857" font-weight="700" text-anchor="middle">6</text>
<path d="M798,203 L727,249" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<rect x="884.0" y="144" width="112" height="53" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="940" y="179" font-size="22" fill="#047857" font-weight="700" text-anchor="middle">7</text>
<path d="M940,203 L1011,249" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<rect x="1026.0" y="144" width="112" height="53" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
<text x="1082" y="179" font-size="22" fill="#b45309" font-weight="700" text-anchor="middle">0 (pad)</text>
<path d="M1082,203 L1011,249" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<rect x="86.0" y="257" width="146" height="53" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="159" y="292" font-size="22" fill="#047857" font-weight="700" text-anchor="middle">3</text>
<path d="M159,316 L301,362" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<rect x="370.0" y="257" width="146" height="53" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="443" y="292" font-size="22" fill="#047857" font-weight="700" text-anchor="middle">7</text>
<path d="M443,316 L301,362" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<rect x="654.0" y="257" width="146" height="53" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="727" y="292" font-size="22" fill="#047857" font-weight="700" text-anchor="middle">11</text>
<path d="M727,316 L869,362" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<rect x="938.0" y="257" width="146" height="53" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="1011" y="292" font-size="22" fill="#047857" font-weight="700" text-anchor="middle">7</text>
<path d="M1011,316 L869,362" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<rect x="221.0" y="370" width="160" height="53" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="301" y="405" font-size="22" fill="#047857" font-weight="700" text-anchor="middle">10</text>
<path d="M301,429 L585,475" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<rect x="789.0" y="370" width="160" height="53" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="869" y="405" font-size="22" fill="#047857" font-weight="700" text-anchor="middle">18</text>
<path d="M869,429 L585,475" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<rect x="480.0" y="483" width="210" height="53" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="585" y="518" font-size="22" fill="#047857" font-weight="700" text-anchor="middle">sum = 28</text>
<text x="32" y="582" font-size="21" fill="#172b4d" font-weight="700" text-anchor="start">This result combines values from one program only.</text>
<text x="32" y="613" font-size="17" fill="#475569" font-weight="400" text-anchor="start">For a whole-input sum split across programs, combine the stored partial results in another phase.</text>
<rect x="32" y="648" width="178" height="94" rx="12" fill="#eff6ff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="679" font-size="20" fill="#2563eb" font-weight="700" text-anchor="start">Program 0</text>
<text x="50" y="708" font-size="17" fill="#475569" font-weight="400" text-anchor="start">Writes partial S0</text>
<rect x="226" y="648" width="178" height="94" rx="12" fill="#eff6ff" stroke="#cbd5e1" stroke-width="2"/>
<text x="244" y="679" font-size="20" fill="#2563eb" font-weight="700" text-anchor="start">Program 1</text>
<text x="244" y="708" font-size="17" fill="#475569" font-weight="400" text-anchor="start">Writes partial S1</text>
<rect x="420" y="648" width="178" height="94" rx="12" fill="#eff6ff" stroke="#cbd5e1" stroke-width="2"/>
<text x="438" y="679" font-size="20" fill="#2563eb" font-weight="700" text-anchor="start">Program 2</text>
<text x="438" y="708" font-size="17" fill="#475569" font-weight="400" text-anchor="start">Writes partial S2</text>
<rect x="614" y="648" width="178" height="94" rx="12" fill="#eff6ff" stroke="#cbd5e1" stroke-width="2"/>
<text x="632" y="679" font-size="20" fill="#2563eb" font-weight="700" text-anchor="start">Program 3</text>
<text x="632" y="708" font-size="17" fill="#475569" font-weight="400" text-anchor="start">Writes partial S3</text>
<path d="M811,695 L843,695" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<rect x="853" y="648" width="315" height="94" rx="12" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="2"/>
<text x="871" y="679" font-size="20" fill="#047857" font-weight="700" text-anchor="start">Second reduction kernel</text>
<text x="871" y="708" font-size="17" fill="#475569" font-weight="400" text-anchor="start">Reads S0..S3 -&gt; total</text>
<text x="32" y="787" font-size="18" fill="#475569" font-weight="400" text-anchor="start">Padding with zero preserves a sum. A maximum reduction needs -infinity instead.</text>
</g></svg>
