<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1090" viewBox="0 0 1200 1090" role="img" aria-labelledby="title desc">
<title id="title">H100 compute hardware: GPU, SM, warps, and arithmetic units</title>
<desc id="desc">Hardware-only conceptual diagram of a full H100 SXM with 132 active streaming multiprocessors. Inside one SM, warp schedulers select instructions from ready warps. An issued instruction uses up to 32 logical execution lanes; the lanes are not dedicated physical cores. Each SM has 128 FP32 arithmetic units, four fourth-generation Tensor Cores, and a pool of 65,536 32-bit registers. Not all resident warps execute simultaneously.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="#64748b"/></marker></defs>
<rect width="1200" height="1090" rx="16" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="32" y="42" font-size="27" fill="#172b4d" font-weight="700" text-anchor="start">H100 compute hardware: from GPU to one SM</text>
<text x="32" y="73" font-size="17" fill="#475569" font-weight="400" text-anchor="start">Reference: full H100 SXM 80 GB. Conceptual organization, not a physical floorplan.</text>
<rect x="32" y="102" width="1136" height="154" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="52" y="134" font-size="22" fill="#2563eb" font-weight="700" text-anchor="start">One GPU contains 132 active streaming multiprocessors (SMs)</text>
<rect x="52" y="154" width="257" height="80" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="70" y="185" font-size="20" fill="#2563eb" font-weight="700" text-anchor="start">SM 0</text>
<text x="70" y="212" font-size="16" fill="#475569" font-weight="400" text-anchor="start">Compute engine</text>
<rect x="329" y="154" width="257" height="80" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="347" y="185" font-size="20" fill="#2563eb" font-weight="700" text-anchor="start">SM 1</text>
<text x="347" y="212" font-size="16" fill="#475569" font-weight="400" text-anchor="start">Compute engine</text>
<rect x="606" y="154" width="257" height="80" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="624" y="185" font-size="20" fill="#2563eb" font-weight="700" text-anchor="start">SM 2</text>
<text x="624" y="212" font-size="16" fill="#475569" font-weight="400" text-anchor="start">Compute engine</text>
<rect x="883" y="154" width="257" height="80" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="901" y="185" font-size="20" fill="#2563eb" font-weight="700" text-anchor="start">SM 131</text>
<text x="901" y="212" font-size="16" fill="#475569" font-weight="400" text-anchor="start">Compute engine</text>
<text x="925" y="277" font-size="16" fill="#475569" font-weight="400" text-anchor="start">Only four SMs are drawn.</text>
<path d="M180,256 L180,294" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="305" width="1136" height="646" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="52" y="340" font-size="22" fill="#2563eb" font-weight="700" text-anchor="start">Zoom into one SM</text>
<rect x="52" y="365" width="439" height="233" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="72" y="397" font-size="20" fill="#2563eb" font-weight="700" text-anchor="start">Ready warps + warp schedulers</text>
<text x="72" y="426" font-size="17" fill="#475569" font-weight="400" text-anchor="start">Many warps can reside on one SM.</text>
<rect x="73" y="446" width="86" height="42" rx="8" fill="#dbeafe" stroke="#cbd5e1" stroke-width="2"/>
<text x="116" y="473" font-size="16" fill="#2563eb" font-weight="700" text-anchor="middle">Warp A</text>
<rect x="173" y="446" width="86" height="42" rx="8" fill="#dbeafe" stroke="#cbd5e1" stroke-width="2"/>
<text x="216" y="473" font-size="16" fill="#2563eb" font-weight="700" text-anchor="middle">Warp B</text>
<rect x="273" y="446" width="86" height="42" rx="8" fill="#dbeafe" stroke="#cbd5e1" stroke-width="2"/>
<text x="316" y="473" font-size="16" fill="#2563eb" font-weight="700" text-anchor="middle">Warp C</text>
<rect x="373" y="446" width="86" height="42" rx="8" fill="#dbeafe" stroke="#cbd5e1" stroke-width="2"/>
<text x="416" y="473" font-size="16" fill="#2563eb" font-weight="700" text-anchor="middle">...</text>
<text x="72" y="521" font-size="17" fill="#475569" font-weight="400" text-anchor="start">A scheduler chooses a ready instruction.</text>
<text x="72" y="548" font-size="17" fill="#475569" font-weight="400" text-anchor="start">Waiting warps can stay resident while</text>
<text x="72" y="573" font-size="17" fill="#475569" font-weight="400" text-anchor="start">other ready warps make progress.</text>
<path d="M491,487 L545,487" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="518" y="464" font-size="14" fill="#475569" font-weight="400" text-anchor="middle">issue</text>
