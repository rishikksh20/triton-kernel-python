<text x="575" y="397" font-size="20" fill="#2563eb" font-weight="700" text-anchor="start">One warp: 32 logical execution lanes</text>
<text x="575" y="426" font-size="17" fill="#475569" font-weight="400" text-anchor="start">Active lanes share instruction issue.</text>
