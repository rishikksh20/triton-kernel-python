<rect x="1058" y="538" width="57" height="25" rx="5" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
<text x="1086.5" y="556" font-size="14" fill="#047857" font-weight="400" text-anchor="middle">31</text>
<text x="575" y="588" font-size="16" fill="#475569" font-weight="400" text-anchor="start">Lane numbers are positions within the warp.</text>
<text x="52" y="633" font-size="16" fill="#172b4d" font-weight="700" text-anchor="start">Logical lanes are positions within a warp;</text>
<text x="52" y="660" font-size="16" fill="#172b4d" font-weight="700" text-anchor="start">they are not fixed physical arithmetic cores.</text>
<rect x="52" y="701" width="439" height="202" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="72" y="735" font-size="20" fill="#2563eb" font-weight="700" text-anchor="start">Register pool: 65,536 × 32-bit</text>
<text x="72" y="766" font-size="16" fill="#475569" font-weight="400" text-anchor="start">262,144 bytes of on-chip working storage</text>
<text x="72" y="800" font-size="17" fill="#475569" font-weight="400" text-anchor="start">Holds operands and intermediate values.</text>
<text x="72" y="831" font-size="17" fill="#475569" font-weight="400" text-anchor="start">The fixed SM capacity is shared across</text>
<text x="72" y="856" font-size="17" fill="#475569" font-weight="400" text-anchor="start">resident execution contexts.</text>
<text x="72" y="888" font-size="16" fill="#475569" font-weight="400" text-anchor="start">More live values consume more registers.</text>
<path d="M745,598 L745,691" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M1003,598 L1003,691" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="555" y="701" width="286" height="202" rx="12" fill="#fff7ed" stroke="#cbd5e1" stroke-width="2"/>
<text x="575" y="735" font-size="20" fill="#b45309" font-weight="700" text-anchor="start">128 FP32 units</text>
<text x="575" y="767" font-size="16" fill="#475569" font-weight="400" text-anchor="start">Single-precision arithmetic</text>
<text x="575" y="800" font-size="17" fill="#475569" font-weight="400" text-anchor="start">Add, multiply, and</text>
<text x="575" y="826" font-size="17" fill="#475569" font-weight="400" text-anchor="start">fused multiply-add.</text>
<text x="575" y="873" font-size="16" fill="#475569" font-weight="400" text-anchor="start">Per SM; 16,896 GPU-wide.</text>
<rect x="861" y="701" width="287" height="202" rx="12" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="2"/>
<text x="881" y="735" font-size="20" fill="#047857" font-weight="700" text-anchor="start">4 Tensor Cores</text>
<text x="881" y="767" font-size="16" fill="#475569" font-weight="400" text-anchor="start">Fourth generation</text>
<text x="881" y="800" font-size="17" fill="#475569" font-weight="400" text-anchor="start">Specialized matrix</text>
<text x="881" y="826" font-size="17" fill="#475569" font-weight="400" text-anchor="start">multiply-accumulate.</text>
<text x="881" y="873" font-size="16" fill="#475569" font-weight="400" text-anchor="start">Per SM; 528 GPU-wide.</text>
<text x="52" y="934" font-size="16" fill="#475569" font-weight="400" text-anchor="start">Other SM units handle integer arithmetic, memory operations, and additional instruction types.</text>
<text x="32" y="989" font-size="17" fill="#172b4d" font-weight="700" text-anchor="start">Read the picture: GPU → many SMs → schedulers issue ready-warp instructions → arithmetic units.</text>
<text x="32" y="1020" font-size="17" fill="#475569" font-weight="400" text-anchor="start">A resident warp is available for scheduling; residency does not mean it executes every cycle.</text>
<text x="32" y="1051" font-size="17" fill="#475569" font-weight="400" text-anchor="start">An issued operation selects its execution units; active lanes and issue rates depend on the operation.</text>
</g>
</svg>
