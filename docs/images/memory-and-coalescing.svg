<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc">
<title id="title">Data movement and coalesced access</title><desc id="desc">An illustrative global-load path connects HBM to L2, optional L1, and thread registers. Shared memory is a separate cooperative staging area. Eight illustrated lanes access contiguous or widely separated addresses, showing why nearby addresses need fewer memory transactions.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="#64748b"/></marker></defs>
<rect width="1200" height="830" rx="16" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="32" y="42" font-size="27" fill="#172b4d" font-weight="700" text-anchor="start">Data movement and coalesced access</text>
<text x="32" y="73" font-size="17" fill="#475569" font-weight="400" text-anchor="start">Caches can satisfy a load before it reaches HBM. Shared memory is a separate staging area.</text>
<rect x="32" y="106" width="255" height="100" rx="12" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="137" font-size="20" fill="#047857" font-weight="700" text-anchor="start">HBM3 / global</text>
<text x="50" y="166" font-size="17" fill="#475569" font-weight="400" text-anchor="start">Large arrays</text>
<text x="50" y="191" font-size="17" fill="#475569" font-weight="400" text-anchor="start">Visible to all programs</text>
<path d="M291,155 L325,155" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<rect x="335" y="106" width="225" height="100" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="353" y="137" font-size="20" fill="#2563eb" font-weight="700" text-anchor="start">L2 cache</text>
<text x="353" y="166" font-size="17" fill="#475569" font-weight="400" text-anchor="start">Shared by SMs</text>
<text x="353" y="191" font-size="17" fill="#475569" font-weight="400" text-anchor="start">Automatic caching</text>
<path d="M564,155 L598,155" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<rect x="608" y="106" width="225" height="100" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="626" y="137" font-size="20" fill="#2563eb" font-weight="700" text-anchor="start">L1 cache</text>
<text x="626" y="166" font-size="17" fill="#475569" font-weight="400" text-anchor="start">Within an SM</text>
<text x="626" y="191" font-size="17" fill="#475569" font-weight="400" text-anchor="start">May be bypassed</text>
<path d="M837,155 L871,155" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<rect x="881" y="106" width="287" height="100" rx="12" fill="#fff7ed" stroke="#cbd5e1" stroke-width="2"/>
<text x="899" y="137" font-size="20" fill="#b45309" font-weight="700" text-anchor="start">Registers</text>
<text x="899" y="166" font-size="17" fill="#475569" font-weight="400" text-anchor="start">Per-thread working values</text>
<text x="899" y="191" font-size="17" fill="#475569" font-weight="400" text-anchor="start">Input to arithmetic</text>
<rect x="32" y="236" width="1136" height="87" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="267" font-size="20" fill="#2563eb" font-weight="700" text-anchor="start">Shared memory: cooperative on-chip storage within a block</text>
<text x="50" y="296" font-size="17" fill="#475569" font-weight="400" text-anchor="start">Compiler-managed staging for some reductions and matrix operations; tl.load does not always stage here.</text>
<text x="32" y="367" font-size="22" fill="#047857" font-weight="700" text-anchor="start">Coalesced: nearby lanes request nearby elements</text>
<text x="32" y="395" font-size="17" fill="#475569" font-weight="400" text-anchor="start">Eight lanes shown; a real NVIDIA warp contains 32 lanes.</text>
