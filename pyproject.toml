[project]
name = "kernel-triton-python"
version = "0.1.0"
description = "Triton GPU kernel tutorials and examples"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.9,<3",
    "triton>=3.5,<4",
    "numpy>=2,<3",
    "matplotlib>=3.9,<4",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
